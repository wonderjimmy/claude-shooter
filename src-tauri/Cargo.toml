[package]
name = "claude-shooter"
version = "0.0.1"
description = "Browser-based bio-mechanical horizontal shoot-'em-up"
authors = ["Jimmy"]
edition = "2021"

[lib]
name = "claude_shooter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
